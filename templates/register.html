{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div style="max-width:400px; margin:50px auto;">
    <div class="card">
        <h2 style="text-align:center; margin-bottom:25px; color:#667eea;"> Register</h2>
        <div id="error-div" style="display:none;" class="alert alert-error"></div>
        <div id="success-div" style="display:none;" class="alert alert-success"></div>
        <div style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px; font-weight:500;">Full Name</label>
            <input type="text" id="full_name" placeholder="Full Name"
                style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:1rem;">
        </div>
        <div style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px; font-weight:500;">Username</label>
            <input type="text" id="username" placeholder="username"
                style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:1rem;">
        </div>
        <div style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px; font-weight:500;">Email</label>
            <input type="email" id="email" placeholder="email@example.com"
                style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:1rem;">
        </div>
        <div style="margin-bottom:20px;">
            <label style="display:block; margin-bottom:5px; font-weight:500;">Password</label>
            <input type="password" id="password" placeholder="At least 6 characters"
                style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:1rem;">
        </div>
        <button onclick="register()" class="btn btn-primary"
            style="width:100%; padding:12px;" id="reg-btn">
            Register
        </button>
        <p style="text-align:center; margin-top:15px; color:#666;">
            have Account ? <a href="/login" style="color:#667eea;">Login</a>
        </p>
    </div>
</div>
<script>
async function register() {
    const full_name = document.getElementById('full_name').value.trim();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('reg-btn');

    if (!username || !email || !password) {
        showError('সব field পূরণ করুন!');
        return;
    }

    btn.disabled = true;
    btn.textContent = ' Registering...';

    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, email, password, full_name})
        });
        const data = await res.json();

        if (res.ok) {
            window.location.assign('/login');
        } else {
            showError(data.detail || 'Registration failed!');
            btn.disabled = false;
            btn.textContent = 'Register';
        }
    } catch(err) {
        showError('Server error!');
        btn.disabled = false;
        btn.textContent = 'Register';
    }
}

function showError(msg) {
    const el = document.getElementById('error-div');
    el.textContent = msg;
    el.style.display = 'block';
}
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartML Advisor{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        nav {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; }
        nav a:hover { opacity: 0.8; }
        .logo { font-size: 1.3rem; font-weight: bold; }
        .main { padding: 30px; max-width: 1100px; margin: auto; }
        .btn {
            padding: 10px 25px; border-radius: 25px; border: none;
            cursor: pointer; font-size: 0.95rem; font-weight: bold;
            text-decoration: none; display: inline-block; transition: 0.2s;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn:hover { opacity: 0.85; transform: scale(1.03); }
        .card {
            background: white; border-radius: 15px;
            padding: 25px; margin-bottom: 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
        .alert {
            padding: 12px 20px; border-radius: 8px;
            margin-bottom: 15px; font-weight: 500;
        }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <nav>
        <div class="logo"> SmartML Advisor</div>
        <div>
            <a href="/">Home</a>
            {% if user %}
            <a href="/dashboard">Dashboard</a>
            <a href="/upload">Upload</a>
            <a href="/history">History</a>
            <a href="/algorithms">Algorithms</a>
            <a href="/logout">Logout</a>
            {% else %}
            <a href="/login">Login</a>
            <a href="/register">Create Account</a>
            {% endif %}
        </div>
    </nav>
    <div class="main">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
